<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>


    <div class="container">
        <h1>Mad Libs Game</h1>
        <p>Fill in the blanks</p>

        <form id="madlib-form">
            <label for="noun">...</label>
            <input type="text" id="noun" required>

            <label for="plural noun">...</label>
            <input type="text" id="plural noun" required>

            <label for="verb ending in -ing">...</label>
            <input type="text" id="verb ending in -ing" required>

            <label for="plural noun">...</label>
            <input type="text" id="plural noun" required>

            <label for="city">...</label>
            <input type="text" id="city" required>

            <label for="plural noun">...</label>
            <input type="text" id="plural noun" required>

            <label for="adjective">...</label>
            <input type="text" id="adjective" required>

            <label for="noun">...</label>
            <input type="text" id="noun" required>

            <label for="number">...</label>
            <input type="text" id="number" required>

            <label for="noun">...</label>
            <input type="text" id="noun" required>

            <label for="adjective">...</label>
            <input type="text" id="adjective" required>

            <label for="verb">...</label>
            <input type="text" id="verb" required>

            <label for="verb">...</label>
            <input type="text" id="verb" required>

            <label for="plural noun">...</label>
            <input type="text" id="plural noun" required>

            <label for="adverb">...</label>
            <input type="text" id="adverb" required>

            <button type="submit">Create</button>
        </form>

        <div id="story-output" class="hidden">
            <h2>Your story:</h2>
            <p id="story"></p>
            <button id="reset-btn">Create another</button>
        

        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>
</html>
